<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viaja con Gris y Aurora | Viajes Los Agaves</title>

  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary-fuchsia: #E91E63;
      --fuchsia-hover: #D81B60;
      --secondary-gold: #FFC107;
      --whatsapp-green: #25D366;
      --whatsapp-hover: #1EBE5D;
      --facebook-blue: #1877F2;
      --text-color: #2D3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      background-color: #0f172a;
      /* Imagen de fondo de campos de agave traslúcida y fija */
      background-image: 
        linear-gradient(rgba(15, 23, 42, 0.35), rgba(15, 23, 42, 0.45)),
        url('https://images.unsplash.com/photo-1518638150340-f706e86654de?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Recuadro principal cristalino y traslúcido para ver la imagen de fondo */
    .main-card {
      width: 100%;
      max-width: 440px;
      /* Valor muy traslúcido (0.48) para visualizar la imagen de fondo claramente */
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Logotipo intacto con contornos redondeados */
    .logo-container {
      width: 100%;
      max-width: 270px;
      margin-bottom: 20px;
      border-radius: 24px;
      overflow: hidden;
      background: #ffffff;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .tagline {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--primary-fuchsia);
      letter-spacing: 0.8px;
      margin-bottom: 24px;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    /* Grupo de Botones */
    .buttons-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 26px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      font-size: 0.98rem;
      font-weight: 800;
      text-decoration: none;
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
    }

    .btn-instagram {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }

    .btn-facebook {
      background-color: var(--facebook-blue);
    }

    .btn-share {
      background: linear-gradient(135deg, #00d2ff, #1e6bf5);
    }

    /* Contenedor de WhatsApp al mismo nivel (lado a lado) */
    .whatsapp-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn-whatsapp {
      flex: 1;
      background-color: var(--whatsapp-green);
      font-size: 0.86rem;
      padding: 14px 8px;
    }

    .btn-whatsapp:hover {
      background-color: var(--whatsapp-hover);
    }

    .btn i {
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <main class="main-card">
    
    <!-- Logotipo enmarcado con contornos redondeados -->
    <div class="logo-container">
      <img src="logo_Gris_y_Aurora.png" alt="Viaja con Gris y Aurora - Viajes Los Agaves">
    </div>

    <p class="tagline">Viajes Los Agaves</p>

    <!-- Botones de Navegación y Contacto -->
    <div class="buttons-container">
      
      <!-- Instagram -->
      <a href="https://www.instagram.com/grisyauroradeviajeslosagaves?vrfl=MTc4amg1YXhzM3p6ZA%3D%3D&utm_source=qr" target="_blank" class="btn btn-instagram" rel="noopener">
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
      </a>

      <!-- Facebook -->
      <a href="https://www.facebook.com/share/19wUEvnEDM/?mibextid=wwXIfr" target="_blank" class="btn btn-facebook" rel="noopener">
        <i class="fa-brands fa-facebook-f"></i>
        <span>Facebook</span>
      </a>

      <!-- WhatsApps lado a lado -->
      <div class="whatsapp-row">
        <!-- Gris -->
        <a href="https://wa.me/523310467836?text=%C2%A1Hola%20Gris!%20Deseo%20m%C3%A1s%20informaci%C3%B3n%20sobre%20un%20viaje." target="_blank" class="btn btn-whatsapp" rel="noopener">
          <i class="fa-brands fa-whatsapp"></i>
          <span>Contacta a Gris</span>
        </a>

        <!-- Aurora -->
        <a href="https://wa.me/523339575211?text=%C2%A1Hola%20Aurora!%20Deseo%20m%C3%A1s%20informaci%C3%B3n%20sobre%20un%20viaje." target="_blank" class="btn btn-whatsapp" rel="noopener">
          <i class="fa-brands fa-whatsapp"></i>
          <span>Contacta a Aurora</span>
        </a>
      </div>

      <!-- Botón Compartir la página -->
      <button type="button" class="btn btn-share" id="btnShare">
        <i class="fa-solid fa-share-nodes"></i>
        <span>Compartir esta Tarjeta</span>
      </button>

    </div>

    <!-- Leyenda y Créditos solicitados -->
    <footer style="text-align: center; font-size: 0.75em; color: #050000; line-height: 1.6;">
      <p style="margin-bottom: 4px;">
        © Gris y Aurora de Viajes Los Agaves. Todos los derechos reservados.
      </p>
      <p style="margin-top: 0;">
        Desarrollado por <a href="https://nexum-it-solutions-mx.github.io/Bienvenidos/" target="_blank" style="color: #fff; font-weight: bold; text-decoration: none;">Nexum IT Solutions</a> | 
        <a href="https://nexum-it-solutions-mx.github.io/Bienvenidos/legal.html#privacidad" target="_blank" style="color: #050000; text-decoration: underline;">Aviso de Privacidad</a> | 
        <a href="https://nexum-it-solutions-mx.github.io/Bienvenidos/legal.html#terminos" target="_blank" style="color: #050000; text-decoration: underline;">Términos y Condiciones</a>
      </p>
    </footer>

  </main>

  <!-- Script para el botón Compartir -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btnShare = document.getElementById("btnShare");

      if (btnShare) {
        btnShare.addEventListener("click", async () => {
          const shareData = {
            title: "Viaja con Gris y Aurora | Viajes Los Agaves",
            text: "¡Conoce los mejores paquetes de viajes y tours con Gris y Aurora de Viajes Los Agaves!",
            url: window.location.href
          };

          if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
            try {
              await navigator.share(shareData);
            } catch (error) {
              if (error.name !== "AbortError") {
                console.error("Error al compartir:", error);
              }
            }
          } else {
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(window.location.href);
                alert("¡Enlace de la página copiado al portapapeles!");
              } else {
                const tempInput = document.createElement("input");
                tempInput.value = window.location.href;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                alert("¡Enlace de la página copiado al portapapeles!");
              }
            } catch (err) {
              alert("Puedes copiar la URL directamente desde la barra de direcciones.");
            }
          }
        });
      }
    });
  </script>

</body>
</html>
